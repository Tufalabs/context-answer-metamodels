[project]
name = "context-answer-metamodels"
version = "0.1.0"
description = "Reproduction code for the Context–Answer Metamodels paper"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "datasets==4.8.4",
    "huggingface-hub==1.26.0",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "torch==2.11.0",
    "transformers==5.14.1",
    "vllm==0.26.0",
]

[project.optional-dependencies]
plots = ["matplotlib"]

[dependency-groups]
dev = [
    "ruff==0.15.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "RUF"]
